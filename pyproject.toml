[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-cli"
version = "0.2.0"
description = "Zero-dependency CLI for the RailGo railway data service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
rail = "rail_cli.cli:main"

[tool.setuptools]
packages = ["rail_cli"]
